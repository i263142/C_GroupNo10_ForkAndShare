<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#14532d"/>
      <stop offset="100%" style="stop-color:#052e16"/>
    </linearGradient>
    <radialGradient id="bowl" cx="50%" cy="40%">
      <stop offset="0%" style="stop-color:#f0fdf4"/>
      <stop offset="100%" style="stop-color:#dcfce7"/>
    </radialGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <!-- Bowl shadow -->
  <ellipse cx="400" cy="425" rx="235" ry="38" fill="#022c22" opacity="0.6"/>
  <!-- Bowl body -->
  <ellipse cx="400" cy="345" rx="240" ry="195" fill="url(#bowl)"/>
  <!-- Base layer of greens -->
  <ellipse cx="400" cy="330" rx="215" ry="170" fill="#16a34a" opacity="0.5"/>
  <!-- Lettuce leaves -->
  <ellipse cx="320" cy="295" rx="90" ry="55" fill="#22c55e" transform="rotate(-20 320 295)"/>
  <ellipse cx="470" cy="285" rx="85" ry="52" fill="#16a34a" transform="rotate(15 470 285)"/>
  <ellipse cx="400" cy="340" rx="100" ry="60" fill="#4ade80" transform="rotate(5 400 340)"/>
  <ellipse cx="260" cy="345" rx="70" ry="45" fill="#15803d" transform="rotate(-10 260 345)"/>
  <ellipse cx="540" cy="350" rx="72" ry="48" fill="#22c55e" transform="rotate(10 540 350)"/>
  <!-- Cherry tomatoes -->
  <circle cx="350" cy="270" r="22" fill="#ef4444"/>
  <circle cx="350" cy="270" r="22" fill="none" stroke="#b91c1c" stroke-width="2"/>
  <circle cx="343" cy="263" r="7" fill="#fca5a5" opacity="0.5"/>
  <circle cx="460" cy="275" r="20" fill="#dc2626"/>
  <circle cx="453" cy="268" r="6" fill="#fca5a5" opacity="0.5"/>
  <circle cx="410" cy="260" r="18" fill="#ef4444"/>
  <!-- Cucumber slices -->
  <circle cx="290" cy="320" r="26" fill="#86efac"/>
  <circle cx="290" cy="320" r="20" fill="#4ade80"/>
  <circle cx="290" cy="320" r="8" fill="#bbf7d0"/>
  <circle cx="510" cy="310" r="24" fill="#86efac"/>
  <circle cx="510" cy="310" r="18" fill="#4ade80"/>
  <circle cx="510" cy="310" r="7" fill="#bbf7d0"/>
  <!-- Carrot shreds (orange streaks) -->
  <path d="M360 330 Q390 315 430 330 Q420 345 380 345Z" fill="#fb923c" opacity="0.9"/>
  <path d="M430 350 Q460 338 490 352" stroke="#f97316" stroke-width="6" fill="none" stroke-linecap="round"/>
  <!-- Feta cheese crumbles -->
  <ellipse cx="380" cy="380" rx="18" ry="10" fill="#fefce8" opacity="0.9"/>
  <ellipse cx="420" cy="370" rx="14" ry="9" fill="#fffbeb" opacity="0.85"/>
  <ellipse cx="450" cy="385" rx="12" ry="8" fill="#fefce8" opacity="0.8"/>
  <!-- Label bar -->
  <rect x="0" y="510" width="800" height="90" fill="#052e16" opacity="0.9"/>
  <text x="400" y="566" font-size="52" font-family="Georgia,serif" font-weight="bold" fill="#f0fdf4" text-anchor="middle">Salads</text>
  <text x="400" y="596" font-size="22" font-family="Arial,sans-serif" fill="#86efac" text-anchor="middle" opacity="0.9">Fresh &amp; Healthy</text>
</svg>
