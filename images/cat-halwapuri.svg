<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#c2410c"/>
      <stop offset="100%" style="stop-color:#92400e"/>
    </linearGradient>
    <radialGradient id="plate" cx="50%" cy="50%">
      <stop offset="0%" style="stop-color:#fef3c7"/>
      <stop offset="100%" style="stop-color:#fde68a"/>
    </radialGradient>
    <radialGradient id="halwa" cx="50%" cy="40%">
      <stop offset="0%" style="stop-color:#f97316"/>
      <stop offset="100%" style="stop-color:#c2410c"/>
    </radialGradient>
  </defs>
  <!-- Background -->
  <rect width="800" height="600" fill="url(#bg)"/>
  <!-- Decorative pattern -->
  <circle cx="100" cy="100" r="80" fill="none" stroke="#fbbf24" stroke-width="2" opacity="0.3"/>
  <circle cx="700" cy="500" r="80" fill="none" stroke="#fbbf24" stroke-width="2" opacity="0.3"/>
  <!-- Thali plate -->
  <ellipse cx="400" cy="340" rx="260" ry="180" fill="#b45309" opacity="0.6"/>
  <ellipse cx="400" cy="330" rx="250" ry="170" fill="url(#plate)"/>
  <!-- Puri (round fried bread) -->
  <ellipse cx="260" cy="290" rx="90" ry="80" fill="#fbbf24" opacity="0.95"/>
  <ellipse cx="260" cy="290" rx="90" ry="80" fill="none" stroke="#d97706" stroke-width="3"/>
  <ellipse cx="260" cy="290" rx="60" ry="50" fill="#fcd34d" opacity="0.7"/>
  <!-- Second Puri -->
  <ellipse cx="230" cy="370" rx="85" ry="75" fill="#f59e0b" opacity="0.9"/>
  <ellipse cx="230" cy="370" rx="55" ry="48" fill="#fcd34d" opacity="0.6"/>
  <!-- Halwa bowl -->
  <ellipse cx="510" cy="300" rx="80" ry="65" fill="url(#halwa)"/>
  <ellipse cx="510" cy="295" rx="70" ry="55" fill="#fb923c" opacity="0.9"/>
  <!-- Chana bowl -->
  <ellipse cx="430" cy="400" rx="65" ry="50" fill="#78350f"/>
  <ellipse cx="430" cy="395" rx="55" ry="42" fill="#92400e"/>
  <ellipse cx="430" cy="390" rx="45" ry="32" fill="#b45309"/>
  <!-- Steam lines -->
  <path d="M510 230 Q520 210 510 190" stroke="white" stroke-width="3" fill="none" opacity="0.5" stroke-linecap="round"/>
  <path d="M530 225 Q542 205 530 185" stroke="white" stroke-width="3" fill="none" opacity="0.4" stroke-linecap="round"/>
  <!-- Label bar -->
  <rect x="0" y="510" width="800" height="90" fill="#78350f" opacity="0.85"/>
  <text x="400" y="568" font-size="52" font-family="Georgia,serif" font-weight="bold" fill="#fef3c7" text-anchor="middle">Halwa Puri</text>
  <text x="400" y="596" font-size="22" font-family="Arial,sans-serif" fill="#fbbf24" text-anchor="middle" opacity="0.9">Pakistani Breakfast</text>
</svg>
