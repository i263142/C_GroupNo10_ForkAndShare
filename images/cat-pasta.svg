<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#991b1b"/>
      <stop offset="100%" style="stop-color:#450a0a"/>
    </linearGradient>
    <radialGradient id="bowl" cx="50%" cy="40%">
      <stop offset="0%" style="stop-color:#fffbeb"/>
      <stop offset="100%" style="stop-color:#fef3c7"/>
    </radialGradient>
    <radialGradient id="sauce" cx="50%" cy="50%">
      <stop offset="0%" style="stop-color:#ef4444"/>
      <stop offset="100%" style="stop-color:#991b1b"/>
    </radialGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <!-- Bowl shadow -->
  <ellipse cx="400" cy="420" rx="230" ry="40" fill="#1c0a0a" opacity="0.5"/>
  <!-- Bowl -->
  <ellipse cx="400" cy="340" rx="240" ry="195" fill="url(#bowl)"/>
  <!-- Sauce base -->
  <ellipse cx="400" cy="330" rx="210" ry="170" fill="url(#sauce)" opacity="0.9"/>
  <!-- Pasta strands (spaghetti loops) -->
  <path d="M270 250 Q370 200 470 260 Q570 320 450 370 Q330 420 250 350 Q200 300 270 250Z" fill="#fef9c3" opacity="0.9"/>
  <path d="M300 270 Q390 230 480 275 Q540 310 460 355 Q370 395 285 355 Q230 325 300 270Z" fill="#fef08a" opacity="0.8"/>
  <path d="M330 290 Q400 265 460 295 Q500 320 455 345 Q400 368 340 345 Q290 325 330 290Z" fill="#fef9c3" opacity="0.7"/>
  <!-- Meatball 1 -->
  <circle cx="310" cy="300" r="35" fill="#7f1d1d"/>
  <circle cx="310" cy="300" r="35" fill="none" stroke="#991b1b" stroke-width="2"/>
  <circle cx="300" cy="290" r="10" fill="#9f1239" opacity="0.5"/>
  <!-- Meatball 2 -->
  <circle cx="490" cy="285" r="32" fill="#7f1d1d"/>
  <circle cx="490" cy="285" r="32" fill="none" stroke="#991b1b" stroke-width="2"/>
  <!-- Basil leaves -->
  <ellipse cx="380" cy="240" rx="22" ry="12" fill="#15803d" transform="rotate(-30 380 240)"/>
  <ellipse cx="420" cy="235" rx="20" ry="11" fill="#166534" transform="rotate(20 420 235)"/>
  <!-- Parmesan shavings -->
  <ellipse cx="420" cy="310" rx="18" ry="8" fill="#fffbeb" opacity="0.8" transform="rotate(-15 420 310)"/>
  <ellipse cx="360" cy="320" rx="15" ry="7" fill="#fef9c3" opacity="0.7" transform="rotate(10 360 320)"/>
  <!-- Label bar -->
  <rect x="0" y="510" width="800" height="90" fill="#450a0a" opacity="0.9"/>
  <text x="400" y="566" font-size="52" font-family="Georgia,serif" font-weight="bold" fill="#fef9c3" text-anchor="middle">Pasta</text>
  <text x="400" y="596" font-size="22" font-family="Arial,sans-serif" fill="#fca5a5" text-anchor="middle" opacity="0.9">Italian Classics</text>
</svg>
